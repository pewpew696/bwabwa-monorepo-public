{% extends "base.html" %}
{% block title %}Masuk · Bwabwa{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="panel-wrap">
  <p class="panel-brand">Rishuu · Every move leaves a trace</p>
  <section class="card" id="auth-panel">
    <h1 class="modal-title">Masuk</h1>
    <p class="text-muted">Masukkan password untuk melanjutkan.</p>
    <form class="modal-form" hx-post="/auth" hx-target="#auth-panel" hx-swap="innerHTML" autocomplete="off">
      <input class="input" type="password" name="password" required autocomplete="off" placeholder="Password" autofocus>
      <button type="submit" class="button">Masuk</button>
    </form>
  </section>
</div>
{% endblock %}
