<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title" class="modal-title">{{ title | default("Fitur terkunci") }}</h2>
    <p class="modal-text">{{ message | default("Masukkan password untuk membuka fitur ini.") }}</p>
    <form class="modal-form" hx-post="/auth/upgrade" hx-target="#modal-root" hx-swap="innerHTML"
          autocomplete="off" data-retry-url="{{ retry_url | default('') }}"
          data-retry-target="{{ retry_target | default('') }}">
      <input class="input" type="password" name="password" required autocomplete="off"
             placeholder="Password" autofocus>
      <div class="modal-actions">
        <button type="button" class="button button-secondary" data-modal-close>Batal</button>
        <button type="submit" class="button">Buka</button>
      </div>
    </form>
  </div>
</div>
